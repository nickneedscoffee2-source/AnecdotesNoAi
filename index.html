<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Avenir Next","Segoe UI",system-ui,sans-serif}

.grid{display:grid;grid-template-columns:3fr 2fr;gap:16px}.grid2{display:grid;grid-template-columns:230px 1fr;gap:16px}
@media(max-width:800px){.grid,.grid2{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
h2{font-size:17px;margin:0 0 10px}h3{font-size:15px;margin:14px 0 6px}
.empty{color:var(--mute);text-align:center;padding:36px 16px}
.tx{min-height:300px;max-height:56vh;overflow:auto;margin-bottom:12px}
.ln{display:flex;gap:8px;align-items:flex-start;padding:8px 6px;border-bottom:1px solid var(--line)}
.ln .tx-t{flex:1}.int{color:var(--mute);font-style:italic;padding:8px 6px}
.b{flex:none;font-size:12px;font-weight:700;border-radius:6px;padding:2px 7px;margin-top:2px}
.b.T{background:var(--tbg);color:var(--t)}.b.S{background:var(--sbg);color:var(--s)}
.who{font-size:12px;color:var(--mute)}
.row{display:flex;gap:8px}.row input,.row select{flex:1;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font:inherit;min-width:0}

.mk{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mute)}

.dot.on{background:var(--acc);border-color:var(--acc)}.dot.sug{border:2px dashed var(--acc)}
.ent{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px solid var(--line)}.ent .tx-t{flex:1}

.item{display:flex;gap:8px;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.tag{font-size:12px;color:var(--mute)}

#tag button{border:0;border-radius:8px;padding:7px 12px;font:inherit;font-weight:600;cursor:pointer}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;display:none;z-index:9}

.ai{background:var(--accbg);border-radius:12px;padding:4px 14px 12px;margin:8px 0}.ai ul{margin:4px 0;padding-left:20px}.ai .item{border-color:#B9DDE0}
header select{background:#22333F;border:1px solid #3A4E5C;color:#fff;border-radius:10px;padding:8px 10px;font:inherit;max-width:200px}header select option{color:#14212B;background:#fff}
#tag{flex-wrap:wrap;max-width:360px}.chipx{border:1px solid var(--line);background:#fff;border-radius:999px;padding:1px 9px;font:inherit;font-size:12px;cursor:pointer;margin:0 4px 2px 0}.chipx:hover,.chipx.on{background:#FBE3E3;border-color:var(--rec)}.rmq{display:inline-block;margin-left:4px;color:var(--ink)}
.sg{padding:6px 8px;border-radius:8px;margin-bottom:4px}.sg.hl{background:#FFF3C4;outline:2px solid #E7C84A}.fb{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;margin:0 0 6px;font:inherit;cursor:pointer}.fb:hover{border-color:var(--acc);background:var(--accbg)}
.tb{border:2px solid var(--line);background:#fff;border-radius:10px;padding:8px 16px;font:inherit;font-weight:600;cursor:pointer;min-height:44px}.tb.on{border-color:var(--ink)}
.ck{margin-top:6px;width:18px;height:18px;flex:none}.bulkp{background:var(--accbg);border-radius:12px;padding:10px 12px;margin:8px 0 12px}#bulk{margin-bottom:6px}
.icon{border:0;background:none;color:var(--mute);cursor:pointer;padding:6px;border-radius:8px;flex:none;display:inline-flex;align-self:flex-start}.icon:hover{background:#FBE3E3;color:var(--rec)}
@media print{header,nav,.noprint{display:none!important}body{background:#fff}}
.gridwrap{overflow-x:auto}.tg{border-collapse:collapse;width:100%;min-width:420px}.tg th,.tg td{border:1px solid var(--line);padding:4px;text-align:center}.tg th{background:#F4F7F8;font-size:13px}.tg td.cr{text-align:left;padding:6px 8px;min-width:130px}
.cell{width:100%;min-width:52px;height:44px;border:2px solid var(--line);background:#fff;border-radius:8px;font:inherit;font-weight:700;font-size:18px;cursor:pointer}.cell:disabled{background:#F1F3F4;cursor:not-allowed;opacity:.5}
.cellnote{width:100%;min-width:70px;border:1px solid var(--line);border-radius:6px;padding:4px;font:inherit;font-size:13px}

#printArea{display:none}.pblock{margin-bottom:26px;break-inside:avoid}.pt th,.pt td{border:1px solid #333!important;height:34px;color:#000}.pt{min-width:0}
@media print{body.pr>*:not(#printArea){display:none!important}body.pr #printArea{display:block}body.pr{background:#fff}}
</style></head><body>
<header><div class="brand">Anecdotal assistant</div>
<div id="ctx" style="display:flex;gap:8px;flex-wrap:wrap"></div>
<span id="sync" style="color:#9FB3C0;font-size:13px"></span><button id="cap" class="btn"></button></header>
<nav id="nav"></nav><main id="main"></main>
<div id="tag"></div>
<div id="toast"></div>
<div id="printArea"></div>
<script>
const KEY='anecdotal-v1',$=s=>document.querySelector(s);
const fresh=()=>({roster:[],lines:[],marks:{},items:{},ai:{},tomb:{},trackers:[],tracks:{},joinSec:8,tidy:true,spokenPunct:false,lang:'en-CA',fixes:'',grade:'',lmode:'dots',lessons:[],idYear:null,idLast:0,codes:{},n:0,sync:{url:'',key:''},aiOn:true,subject:'Language',strand:'',term:'',mode:'dots',hide:false});
let syncT,syncing=false;
let S;try{S=Object.assign(fresh(),JSON.parse(localStorage.getItem(KEY)))}catch(e){S=fresh()}
const persist=()=>{try{stamp();localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Could not save on this device.')}};
const save=()=>{persist();queueSync()};
/* change tracking: every record gets an update time (u) when it changes, and a tombstone when it is deleted, so devices can merge */
const hsh=t=>{let x=5381;for(let i=0;i<t.length;i++)x=((x<<5)+x+t.charCodeAt(i))|0;return x.toString(36)};
const recHash=r=>hsh(JSON.stringify(r,(k,v)=>k==='u'?undefined:v));
function eachRec(fn){S.roster.forEach(r=>fn('st:'+r.id,r));S.lines.forEach(r=>fn('ln:'+r.id,r));S.lessons.forEach(r=>fn('ls:'+r.id,r));
 for(const sid in S.items)S.items[sid].forEach(r=>fn('it:'+r.id,r));for(const k in S.marks)if(S.marks[k])fn('mk:'+k,S.marks[k]);for(const k in S.ai)if(S.ai[k]&&typeof S.ai[k]==='object')fn('ai:'+k,S.ai[k]);S.trackers.forEach(r=>fn('tr:'+r.id,r));for(const k in S.tracks)fn('te:'+k,S.tracks[k])}
function stamp(){const now=Date.now();S.tomb=S.tomb||{};
 if(!S.h){S.h={};eachRec((t,r)=>{S.h[t]=recHash(r)});return}
 const seen={};eachRec((t,r)=>{seen[t]=1;const x=recHash(r);if(S.h[t]!==x){S.h[t]=x;r.u=now}if(S.tomb[t])delete S.tomb[t]});
 for(const t in S.h)if(!seen[t]){S.tomb[t]=now;delete S.h[t]}}
function h(t,p,...k){const e=document.createElement(t);for(const[a,v]of Object.entries(p||{})){if(v==null||v===false)continue;if(a==='class')e.className=v;else if(a.startsWith('on'))e.addEventListener(a.slice(2),v);else if(a==='dataset')Object.assign(e.dataset,v);else e.setAttribute(a,v)}for(const c of k.flat())if(c!=null&&c!==false)e.append(c.nodeType?c:document.createTextNode(c));return e}
const sv=(t,p,...k)=>{const e=document.createElementNS('http://www.w3.org/2000/svg',t);for(const[a,v]of Object.entries(p||{}))e.setAttribute(a,v);k.forEach(c=>e.append(c));return e};
const uid=()=>Math.random().toString(36).slice(2,9),day=()=>new Date().toLocaleDateString('en-CA');
const fd=d=>new Date(d+'T12:00').toLocaleDateString(undefined,{month:'short',day:'numeric'});
const nm=s=>!s?'(removed)':S.hide?s.name.split(/\s+/).map(w=>w[0]).join('.')+'.':s.name;
const stu=id=>S.roster.find(r=>r.id===id);
const empty=t=>h('div',{class:'card empty'},t);
const osel=(lab,opts,val,fn)=>h('select',{'aria-label':lab,title:lab,onchange:e=>fn(e.target.value)},opts.map(o=>h('option',{value:o[0],selected:o[0]===val?'':null},o[1])));
const short=(t,n=14)=>{const w=t.split(/\s+/);return w.slice(0,n).join(' ')+(w.length>n?'…':'')};
function toast(t,undo){const e=$('#toast');e.replaceChildren(t);if(undo)e.append(' ',h('button',{class:'btn sm',onclick:()=>{undo();e.style.display='none'}},'Undo'));e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',undo?7000:2600)}
const CATS=[['participation','Participation'],['knowledge','Knowledge'],['application','Application'],['thinking','Thinking'],['communication','Communication']];
const KW={knowledge:/\b(know|knows|because|means|learned|fact|remember|correct|right)\b/i,application:/\b(use|used|apply|applied|example|try|tried|add|added|revise|edit|edited)\b/i,thinking:/\b(why|think|thought|predict|compare|maybe|idea|reason|wonder|what if)\b/i,communication:/\b(explain|explained|tell|told|describe|share|shared|said|show)\b/i};
const TYPES={L:'Learned',S:'Strength',G:'Growth',N:'Next step'};
/* Ontario elementary curriculum strands (edit this list if your grade's document differs) */
const ART=['A. Creating and Presenting','B. Reflecting, Responding, and Analysing','C. Exploring Forms and Cultural Contexts'];
const CURR={
 'Math':['A. SEL Skills and the Mathematical Processes','B. Number','C. Algebra','D. Data','E. Spatial Sense','F. Financial Literacy'],
 'Language':['A. Literacy Connections and Applications','B. Foundations of Language','C. Comprehension','D. Composition'],
 'Science and Technology':['A. STEM Skills and Connections','B. Life Systems','C. Matter and Energy','D. Structures and Mechanisms','E. Earth and Space Systems'],
 'Social Studies':['A. Heritage and Identity','B. People and Environments','History (Grades 7–8)','Geography (Grades 7–8)'],
 'Health':['A. Social-Emotional Learning Skills','D. Healthy Living'],
 'Phys-Ed':['A. Social-Emotional Learning Skills','B. Active Living','C. Movement Competence'],
 'Music':['A. Creating and Performing','B. Reflecting, Responding, and Analysing','C. Exploring Forms and Cultural Contexts'],
 'Visual Arts':ART,'Drama':ART,'Dance':ART,
 'French':['A. Listening','B. Speaking','C. Reading','D. Writing'],
 'Other':[]};
const SUBJ=Object.keys(CURR),TERMS=['Progress','Term 1','Term 2'],SUBJ_MAP={Writing:'Language',Reading:'Language',Science:'Science and Technology'};
function defaultTerm(){const m=new Date().getMonth();return m===10||m===11||m===0?'Term 1':(m>=1&&m<=5?'Term 2':'Progress')}
function normSubjects(){let ch=false;
 S.lines.forEach(l=>{if(SUBJ_MAP[l.subject]){l.subject=SUBJ_MAP[l.subject];ch=true}});
 const rk=o=>{const r={};for(const k in o){const p=k.split('|'),i=p[0]==='P'?3:2;if(p[i]&&SUBJ_MAP[p[i]]){p[i]=SUBJ_MAP[p[i]];ch=true}r[p.join('|')]=o[k]}return r};
 S.marks=rk(S.marks);S.ai=rk(S.ai);if(SUBJ_MAP[S.subject]){S.subject=SUBJ_MAP[S.subject];ch=true}return ch}
function buildCtx(){normSubjects();if(!CURR[S.subject])S.subject='Other';if(S.strand&&!CURR[S.subject].includes(S.strand))S.strand='';if(!TERMS.includes(S.term))S.term=defaultTerm();
 $('#ctx').replaceChildren(
  osel('Subject',SUBJ.map(x=>[x,x]),S.subject,v=>{S.subject=v;S.strand='';save();buildCtx()}),
  osel('Strand',[['','Any strand']].concat(CURR[S.subject].map(x=>[x,x])),S.strand,v=>{S.strand=v;save()}),
  osel('Reporting period',TERMS.map(x=>[x,x]),S.term,v=>{S.term=v;save()}),
  osel('Grade',[['','Grade']].concat([1,2,3,4,5,6,7,8].map(g=>[String(g),'Grade '+g])),S.grade||'',v=>{S.grade=v;save()}))}
const meta=l=>[l.subject,l.strand,l.term].filter(Boolean).join(' · ');
const grpMeta=ls=>[ls[0].term,[...new Set(ls.map(l=>l.strand).filter(Boolean))].join(', ')].filter(Boolean).join(' · ');
const termOf=(sid,d,sub)=>{const l=S.lines.find(x=>x.date===d&&x.subject===sub&&x.students.includes(sid)&&x.term);return l?l.term:S.term};
let view='live',selS=null,active=[],capturing=false,listening=false,rec=null,interim='',selIds=[],mapRange=0,pTerm='',fTerm='',fSub='',checked=new Set(),bulkTo=new Set(),rmP=null,lEdit=null,trSel='',trForm=null,trDate='',trWk={},trCont=null,prDlg=null,edLbl=null,lessonOn=false,lessonMic=false,lessonSel=null,lHl=new Set(),lf={sub:'',strand:'',term:'',grade:'',from:'',to:''};

/* ---------- listening ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function startMic(){
 if(!SR){toast('Speech recognition needs Chrome or Edge. You can still type notes.');return}
 rec=new SR();rec.continuous=true;rec.interimResults=true;if(S.lang)rec.lang=S.lang;
 rec.onresult=e=>{let f='',i='';for(let n=e.resultIndex;n<e.results.length;n++){const r=e.results[n];if(r.isFinal)f+=r[0].transcript;else i+=r[0].transcript}
  interim=(capturing||lessonOn)?i:'';if(f.trim())handle(f.trim());renderLive();renderLesson()};
 rec.onend=()=>{if(listening)try{rec.start()}catch(e){}};
 rec.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){listening=false;capturing=false;syncBar();toast('Microphone is blocked. Allow it in the address bar.')}};
 listening=true;try{rec.start()}catch(e){}syncBar()}
function stopMic(){lessonFinish();lessonMic=false;listening=false;capturing=false;interim='';try{rec.stop()}catch(e){}syncBar();renderLive();autoAnalyze()}
function toggleCap(){capturing=!capturing;interim='';toast(capturing?'Capturing started':'Capturing stopped');syncBar();renderLive();if(!capturing)autoAnalyze()}
function handle(t){if(lessonOn){addLessonText(fixText(t));return}t.split(/sound\s?gardens?/ig).forEach((p,i)=>{if(i>0)toggleCap();if(capturing&&p.trim())addText(fixText(p.trim()))})}
const esc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
function findNames(t){const first={};S.roster.forEach(s=>{const f=s.name.split(/\s+/)[0].toLowerCase();first[f]=(first[f]||0)+1});
 return S.roster.filter(s=>{const f=s.name.split(/\s+/)[0].toLowerCase(),k=[s.name.toLowerCase().replace(/[.\s]+$/,'')];if(first[f]===1)k.push(f);(s.alias||[]).forEach(a=>k.push(a.toLowerCase()));return k.some(x=>new RegExp('\\b'+esc(x)+'\\b','i').test(t))}).map(s=>s.id)}
function guess(t,named){const last=S.lines[S.lines.length-1];
 if(named||/\?\s*$/.test(t)||/^(ok|okay|tell me|show me|what|why|how|can you|great|nice|good|i like|i see|try|remember)\b/i.test(t))return'T';
 return last?(last.who==='T'?'S':last.who):'T'}
function addText(t){const ids=findNames(t);const who=guess(t,ids.length>0);if(ids.length)active=ids;
 const sp=who==='S'&&active.length===1?active[0]:undefined,last=S.lines[S.lines.length-1],gap=(S.joinSec||0)*1000;
 if(gap&&!ids.length&&last&&last.ts&&last.date===day()&&last.who===who&&last.sp===sp&&last.subject===S.subject&&(last.strand||'')===(S.strand||'')&&last.term===S.term&&Date.now()-last.ts<=gap&&String(last.students)===String(active)){
  joinTidy(last,t,'text');last.ts=Date.now();save();renderLive();return}
 const tn=tidyNew(t);S.lines.push({id:uid(),ts:Date.now(),date:day(),subject:S.subject,who,text:tn.text,auto:tn.auto||undefined,students:[...active],strand:S.strand||undefined,term:S.term,sp});save();renderLive()}
function suggest(ls,sid){const o={participation:Math.min(4,ls.filter(l=>l.who==='S'&&(!l.sp||l.sp===sid)).length)};
 CATS.slice(1).forEach(([c])=>o[c]=Math.min(4,ls.filter(l=>KW[c].test(l.text)).length));return o}

/* ---------- chrome ---------- */
function syncBar(){const m=$('#mic'),c=$('#cap');
 if(m){m.textContent=listening?'Stop listening':'Start listening';m.className='btn mic '+(listening?'on':'pri')}
 c.disabled=!listening||lessonOn;c.textContent=lessonOn?'Lesson recording…':capturing?'Capturing — tap to pause':'Paused — say “Soundgarden”';c.className='btn '+(capturing?'rec':'')}
$('#cap').onclick=toggleCap;
buildCtx();
const NAV=[['live','Live'],['students','Students'],['trackers','Trackers'],['parent','Parent call'],['lesson','Lesson Feedback'],['map','Map'],['settings','Settings']];
NAV.forEach(([v,l])=>$('#nav').append(h('button',{dataset:{v},onclick:()=>{view=v;render()}},l)));
function render(){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
 const m=$('#main');m.replaceChildren();if(newYearDue())m.append(yearBanner());({live:vLive,students:vStudents,trackers:vTrackers,parent:vParent,lesson:vLesson,map:vMap,settings:vSettings})[view](m);syncBar()}

/* ---------- live ---------- */
function vLive(m){
 if(!S.roster.length)m.append(h('div',{class:'card'},'Start by adding your class list in ',h('button',{class:'btn sm',onclick:()=>{view='settings';render()}},'Settings'),'.'));
 m.append(h('div',{class:'grid'},
  h('section',{class:'card'},h('h2',{},'Conversation'),h('div',{id:'bulk'}),h('div',{class:'convo'},h('div',{id:'tx',class:'tx'}),h('button',{id:'mic',class:'btn mic','aria-label':'Start or stop listening',onclick:()=>listening?stopMic():startMic()})),
   h('div',{class:'row'},h('input',{id:'typed',placeholder:'Or type a note…','aria-label':'Type a note',onkeydown:e=>{if(e.key==='Enter')typed()}}),h('button',{class:'btn',onclick:typed},'Add note')),
   h('p',{class:'note'},'Highlight text to mark it as Teacher said or Student said.')),
